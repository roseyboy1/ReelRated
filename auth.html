
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReelRated | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">REEL<span>RATED</span>.</a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="catalogue.html">Movies</a>
            <a href="index.html#reviews">Reviews</a>
            <a href="community.html">Community</a>
        </div>
    </nav>

    <main class="auth-container">

        <h1>Welcome to ReelRated</h1>
        <p>Log in to rate movies and share your reviews.</p>

        <!-- LOGIN FORM -->

        <div class="auth-box" id="loginBox">

            <h2>Welcome Back</h2>

            <form id="loginForm">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email address"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit">Log In</button>

            </form>

            <p>Don't have an account? <a href="#signup" id="showSignup">Create Account</a></p>

        </div>

        <!-- CREATE ACCOUNT FORM -->

        <div class="auth-box" id="signupBox" hidden>

            <h2>Create Account</h2>

            <form id="signupForm">

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Email address"
                    required
                >

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit">Create Account</button>

            </form>

            <p>Already have an account? <a href="#login" id="showLogin">Log In</a></p>

        </div>

    </main>

    <script type="module" src="auth.js"></script>

</body>
</html>
